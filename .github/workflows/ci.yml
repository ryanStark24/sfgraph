name: CI

# TEMPORARY debug workflow (branch debug/windows-stop-waiting): traces the
# Windows-only hang in stop-waiting.test.ts. Not for merge.
on:
  push:
    branches: [debug/windows-stop-waiting]

jobs:
  build:
    # Cross-platform matrix: ubuntu (the dev box default), macOS (binding
    # code-signing is darwin-only and the postinstall verifier exercises
    # that path), Windows (npx.cmd / sf.cmd / taskkill toolchain paths).
    # If any of these break in a PR, we want to know before publish.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull LFS objects so the vendored MiniLM ONNX weights resolve
          # for model-loader tests on all three platforms.
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: stop-waiting alone
        continue-on-error: true
        working-directory: packages/core
        run: npx vitest run src/extractors/live-org/__tests__/stop-waiting.test.ts -t "QUEUED"
      - name: stop-waiting file x3
        continue-on-error: true
        working-directory: packages/core
        run: |
          npx vitest run src/extractors/live-org/__tests__/stop-waiting.test.ts
          npx vitest run src/extractors/live-org/__tests__/stop-waiting.test.ts
          npx vitest run src/extractors/live-org/__tests__/stop-waiting.test.ts
