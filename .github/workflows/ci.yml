name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    # Cross-platform matrix: ubuntu (the dev box default), macOS (binding
    # code-signing is darwin-only and the postinstall verifier exercises
    # that path), Windows (npx.cmd / sf.cmd / taskkill toolchain paths).
    # If any of these break in a PR, we want to know before publish.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull LFS objects so the vendored MiniLM ONNX weights resolve
          # for model-loader tests on all three platforms.
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Workspace packages resolve each other through dist/, so build first.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
        if: runner.os != 'Windows'
      # Windows: one package's suite at a time. `pnpm -r` runs up to four
      # packages' tests at once; on the Windows runner core, mcp-server and cli
      # together starve vitest's main process, and a worker gives up on it
      # ("Timeout calling onTaskUpdate") with every test passing.
      - run: pnpm -r --workspace-concurrency=1 test
        if: runner.os == 'Windows'
