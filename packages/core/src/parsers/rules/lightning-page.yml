type: FlexiPage
category: FlexiPage
input: xml-string
root: FlexiPage
applies_when:
  always: true

nodes:
  - label: FlexiPage
    qname: "FlexiPage:${record.name}"
    props:
      name: "${record.name}"
      type: "${record.type | raw}"
      sobjectType: "${record.sobjectType | raw}"

edges:
  # Custom LWCs appear as `c:name` or a bare `name`; any other `ns:name`
  # (flexipage:, force:, managed packages) is not a local LWC.
  - relType: EMBEDS_LWC
    iterate: "${walkAll(record.flexiPageRegions,'componentName')}"
    when: "${match(toString(item),'^(?:c:)?([A-Za-z]\\w*)$')}"
    src: "FlexiPage:${record.name}"
    dst: "LWC:${match(toString(item),'^(?:c:)?([A-Za-z]\\w*)$')}"
