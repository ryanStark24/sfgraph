type: CustomMetadata
category: CustomMetadataType
input: xml-string
root: CustomMetadata
applies_when:
  always: true

nodes:
  - label: CustomMetadataRecord
    when: "${record.kind == 'record' || split(toString(record.name),'.')[1]}"
    qname: "CustomMetadataRecord:${record.name}"
    props:
      name: "${record.name}"
      # Capture the record's field VALUES (metadata.read returns a <values>
      # array of {field,value}) so the graph shows what the config resolves to
      # — endpoints, matching keys, toggles — not just that the record exists.
      # buildEmbedText (live-ingest) folds these into the node's embedding so
      # find_similar matches on the values, and they're inspectable via
      # find_nodes/analyze. `| raw` returns the array unmodified.
      values: "${record.values | raw}"

  # A custom metadata TYPE is the CustomObject `X__mdt` the object directory
  # (and the live-org CustomObject retrieve) already emits; that is its one
  # canonical qname, owned by the object parser. A dot-less member (which
  # names the type itself) therefore writes no node here: a second writer
  # with fewer attributes would overwrite the object parser's node whenever
  # the hashes differ.

edges:
  - relType: INSTANCE_OF
    when: "${(record.kind == 'record' || split(toString(record.name),'.')[1]) && split(toString(record.name),'.')[0]}"
    src: "CustomMetadataRecord:${record.name}"
    dst: "CustomObject:${match(split(toString(record.name),'.')[0],'^(.*?)(?:__mdt)?$')}__mdt"
